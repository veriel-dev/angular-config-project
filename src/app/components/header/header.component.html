<header class="bg-gray-800 shadow-lg fixed w-full top-0 z-50 border-b border-gray-700">
  <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <!-- Logo -->
      <div class="flex items-center">
        <a href="#" class="flex items-center">
          <span class="text-2xl font-bold text-primary-400">Studio</span>
          <span class="text-2xl font-light text-gray-400">Lab</span>
        </a>
        <span
          *ngIf="envName !== 'PRO'"
          class="ml-2 px-2 py-1 text-xs font-semibold rounded"
          [ngClass]="{
            'bg-yellow-900 text-yellow-300': envName === 'DES',
            'bg-blue-900 text-blue-300': envName === 'PRE',
            'bg-gray-700 text-gray-300': envName === 'LOCAL'
          }"
        >
          {{ envName }}
        </span>
      </div>

      <!-- Desktop Navigation -->
      <div class="hidden md:flex items-center space-x-8">
        <a
          *ngFor="let link of navLinks"
          [href]="link.href"
          class="text-gray-300 hover:text-primary-400 transition-colors font-medium"
        >
          {{ link.label }}
        </a>
        <a
          href="#contact"
          class="bg-primary-600 text-white px-4 py-2 rounded-lg hover:bg-primary-500 transition-colors"
        >
          Empezar proyecto
        </a>
      </div>

      <!-- Mobile menu button -->
      <button
        (click)="toggleMenu()"
        class="md:hidden p-2 rounded-lg text-gray-300 hover:bg-gray-700"
        aria-label="Toggle menu"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            *ngIf="!isMenuOpen"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
          <path
            *ngIf="isMenuOpen"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>

    <!-- Mobile Navigation -->
    <div
      *ngIf="isMenuOpen"
      class="md:hidden py-4 border-t border-gray-700"
    >
      <div class="flex flex-col space-y-4">
        <a
          *ngFor="let link of navLinks"
          [href]="link.href"
          (click)="toggleMenu()"
          class="text-gray-300 hover:text-primary-400 transition-colors font-medium"
        >
          {{ link.label }}
        </a>
        <a
          href="#contact"
          (click)="toggleMenu()"
          class="bg-primary-600 text-white px-4 py-2 rounded-lg hover:bg-primary-500 transition-colors text-center"
        >
          Empezar proyecto
        </a>
      </div>
    </div>
  </nav>
</header>
