<section id="about" class="py-16 md:py-24 bg-white">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
      <!-- Image/Illustration -->
      <div class="order-2 lg:order-1">
        <div class="bg-gradient-to-br from-primary-100 to-primary-200 rounded-2xl h-80 md:h-96 flex items-center justify-center">
          <svg class="w-32 h-32 text-primary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
        </div>
      </div>

      <!-- Content -->
      <div class="order-1 lg:order-2">
        <h2 class="text-3xl md:text-4xl font-bold text-gray-900">
          {{ sectionTitle }}
        </h2>
        <p class="mt-6 text-lg text-gray-600">
          {{ description }}
        </p>
        <p class="mt-4 text-lg text-gray-600">
          {{ secondaryText }}
        </p>

        <!-- Stats -->
        <div class="mt-10 grid grid-cols-2 gap-6">
          <div *ngFor="let stat of stats" class="text-center p-4 bg-gray-50 rounded-lg">
            <div class="text-3xl font-bold text-primary-600">
              {{ stat.value }}
            </div>
            <div class="mt-1 text-sm text-gray-600">
              {{ stat.label }}
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
