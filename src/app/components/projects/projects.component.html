<section id="projects" class="py-16 md:py-24 bg-gray-800">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <!-- Section Header -->
    <div class="text-center max-w-3xl mx-auto mb-16">
      <h2 class="text-3xl md:text-4xl font-bold text-white">
        {{ sectionTitle }}
      </h2>
      <p class="mt-4 text-lg text-gray-400">
        {{ sectionSubtitle }}
      </p>
    </div>

    <!-- Projects Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <div
        *ngFor="let project of projects"
        class="bg-gray-900 rounded-xl overflow-hidden shadow-md hover:shadow-xl hover:shadow-primary-900/20 transition-all group border border-gray-700"
      >
        <!-- Project Image Placeholder -->
        <div class="h-48 bg-gradient-to-br from-gray-700 to-gray-800 flex items-center justify-center">
          <svg *ngIf="project.image === 'ecommerce'" class="w-16 h-16 text-primary-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
          </svg>
          <svg *ngIf="project.image === 'fintech'" class="w-16 h-16 text-primary-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <svg *ngIf="project.image === 'corporate'" class="w-16 h-16 text-primary-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
          </svg>
        </div>

        <!-- Project Content -->
        <div class="p-6">
          <span class="text-sm font-medium text-primary-400">
            {{ project.category }}
          </span>
          <h3 class="mt-2 text-xl font-semibold text-white group-hover:text-primary-400 transition-colors">
            {{ project.title }}
          </h3>
          <p class="mt-2 text-gray-400">
            {{ project.description }}
          </p>
          <a
            href="#"
            class="mt-4 inline-flex items-center text-primary-400 font-medium hover:text-primary-300"
          >
            Ver caso de estudio
            <svg class="ml-2 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
          </a>
        </div>
      </div>
    </div>

    <!-- View All Projects Button -->
    <div class="mt-12 text-center">
      <a
        href="#"
        class="inline-flex items-center px-6 py-3 text-base font-medium rounded-lg text-primary-400 bg-gray-900 border-2 border-primary-500 hover:bg-gray-700 transition-colors"
      >
        Ver todos los proyectos
        <svg class="ml-2 w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3" />
        </svg>
      </a>
    </div>
  </div>
</section>
