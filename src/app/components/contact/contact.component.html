<section id="contact" class="py-16 md:py-24 bg-gray-800">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
      <!-- Contact Info -->
      <div class="text-white">
        <h2 class="text-3xl md:text-4xl font-bold">
          {{ sectionTitle }}
        </h2>
        <p class="mt-4 text-lg text-gray-400">
          {{ sectionSubtitle }}
        </p>

        <div class="mt-10 space-y-6">
          <!-- Email -->
          <div class="flex items-center">
            <div class="w-12 h-12 bg-gray-700 rounded-lg flex items-center justify-center">
              <svg class="w-6 h-6 text-primary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
            </div>
            <div class="ml-4">
              <p class="text-sm text-gray-500">Email</p>
              <p class="text-lg font-medium text-gray-200">{{ contactInfo.email }}</p>
            </div>
          </div>

          <!-- Phone -->
          <div class="flex items-center">
            <div class="w-12 h-12 bg-gray-700 rounded-lg flex items-center justify-center">
              <svg class="w-6 h-6 text-primary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
              </svg>
            </div>
            <div class="ml-4">
              <p class="text-sm text-gray-500">Telefono</p>
              <p class="text-lg font-medium text-gray-200">{{ contactInfo.phone }}</p>
            </div>
          </div>

          <!-- Address -->
          <div class="flex items-center">
            <div class="w-12 h-12 bg-gray-700 rounded-lg flex items-center justify-center">
              <svg class="w-6 h-6 text-primary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </div>
            <div class="ml-4">
              <p class="text-sm text-gray-500">Direccion</p>
              <p class="text-lg font-medium text-gray-200">{{ contactInfo.address }}</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Contact Form -->
      <div class="bg-gray-900 rounded-2xl p-8 border border-gray-700">
        <form (ngSubmit)="onSubmit()" class="space-y-6">
          <div>
            <label for="name" class="block text-sm font-medium text-gray-300">Nombre</label>
            <input
              type="text"
              id="name"
              name="name"
              [(ngModel)]="formData.name"
              class="mt-1 block w-full px-4 py-3 bg-gray-800 border border-gray-600 rounded-lg text-white placeholder-gray-500 focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
              placeholder="Tu nombre"
              required
            />
          </div>

          <div>
            <label for="email" class="block text-sm font-medium text-gray-300">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              [(ngModel)]="formData.email"
              class="mt-1 block w-full px-4 py-3 bg-gray-800 border border-gray-600 rounded-lg text-white placeholder-gray-500 focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
              placeholder="tu@email.com"
              required
            />
          </div>

          <div>
            <label for="message" class="block text-sm font-medium text-gray-300">Mensaje</label>
            <textarea
              id="message"
              name="message"
              rows="4"
              [(ngModel)]="formData.message"
              class="mt-1 block w-full px-4 py-3 bg-gray-800 border border-gray-600 rounded-lg text-white placeholder-gray-500 focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
              placeholder="Cuentanos sobre tu proyecto..."
              required
            ></textarea>
          </div>

          <button
            type="submit"
            class="w-full bg-primary-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-primary-500 transition-colors"
          >
            Enviar mensaje
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
