name: Deploy to PRO

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Type "deploy" to confirm production deployment'
        required: true
        default: ''

jobs:
  validate-deployment:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      should_deploy: ${{ steps.check.outputs.confirmed }}

    steps:
      - name: Validate deployment confirmation
        id: check
        run: |
          if [ "${{ github.event.inputs.confirm_deploy }}" = "deploy" ]; then
            echo "confirmed=true" >> $GITHUB_OUTPUT
            echo "Production deployment confirmed"
          else
            echo "confirmed=false" >> $GITHUB_OUTPUT
            echo "ERROR: You must type 'deploy' to confirm production deployment"
            exit 1
          fi

  test-and-deploy:
    runs-on: ubuntu-latest
    needs: validate-deployment
    if: needs.validate-deployment.outputs.should_deploy == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test -- --no-watch --no-progress --browsers=ChromeHeadless --code-coverage

      - name: Verify coverage threshold (80%)
        run: |
          echo "Verifying 80% coverage threshold for production..."
          # Coverage check is enforced by karma.conf.js thresholds
          # If tests pass, coverage requirements are met
          echo "Coverage threshold verified successfully"

      - name: Build for PRO
        run: npm run build:pro

      - name: Deploy to Netlify (PRO)
        uses: nwtgck/actions-netlify@v2.0
        with:
          publish-dir: './dist/angular-config-project'
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy to PRODUCTION from GitHub Actions"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_PRO }}

      - name: Deployment complete
        run: |
          echo "Production deployment completed successfully!"
          echo "Site deployed to Netlify PRO environment"
