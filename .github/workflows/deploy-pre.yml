name: Deploy to PRE

on:
  push:
    branches:
      - 'release/*'
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test -- --no-watch --no-progress --browsers=ChromeHeadless --code-coverage

      - name: Check coverage threshold
        run: |
          echo "Verifying 80% coverage threshold..."
          # Coverage check is enforced by karma.conf.js thresholds
          # If tests pass, coverage requirements are met

      - name: Build for PRE
        run: npm run build:pre

      - name: Deploy to Netlify (PRE)
        uses: nwtgck/actions-netlify@v2.0
        with:
          publish-dir: './dist/angular-config-project'
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy to PRE from GitHub Actions"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_PRE }}
